<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Typing Trainer</title>
    <link rel="stylesheet" href="./src/styles/style.css" />
    <script defer type="module" src="./src/app.js"></script>
  </head>

  <body>
    <main>
      <div class="container">
        <div class="display">
          <div class="stats">
            <span>WPM: <span class="stat__value wpm">0</span></span>
            <span>
              | Accuracy: <span class="stat__value accuracy">0</span>%
            </span>
            <span>
              | Errors:
              <span class="stat__value errors">0</span>
            </span>
            <span class="timer">
              | Time:
              <span class="stat__value minutes">00</span>:<span
                class="stat__value seconds"
                >00
              </span>
            </span>
          </div>

          <div class="text">
            <div class="text-slider">
              <div class="text-slider__previous"></div>
              <div class="text-slider__current"></div>
              <div class="text-slider__next"></div>
            </div>
          </div>
        </div>

        <div class="keyboard" aria-hidden="true">
          <div class="keyboard__keys">
            <div class="keyboard__key" data-code="Backquote">~</div>
            <div class="keyboard__key" data-code="Digit1">1</div>
            <div class="keyboard__key" data-code="Digit2">2</div>
            <div class="keyboard__key" data-code="Digit3">3</div>
            <div class="keyboard__key" data-code="Digit4">4</div>
            <div class="keyboard__key" data-code="Digit5">5</div>
            <div class="keyboard__key" data-code="Digit6">6</div>
            <div class="keyboard__key" data-code="Digit7">7</div>
            <div class="keyboard__key" data-code="Digit8">8</div>
            <div class="keyboard__key" data-code="Digit9">9</div>
            <div class="keyboard__key" data-code="Digit0">0</div>
            <div class="keyboard__key" data-code="Minus">-</div>
            <div class="keyboard__key" data-code="Equal">=</div>
            <div class="keyboard__key backspace letter-key" data-code="Backspace">Backspace</div>
          </div>

          <div class="keyboard__keys">
            <div class="keyboard__key tab letter-key" data-code="Tab">Tab</div>
            <div class="keyboard__key" data-code="KeyQ">q</div>
            <div class="keyboard__key" data-code="KeyW">w</div>
            <div class="keyboard__key" data-code="KeyE">e</div>
            <div class="keyboard__key" data-code="KeyR">r</div>
            <div class="keyboard__key" data-code="KeyT">t</div>
            <div class="keyboard__key" data-code="KeyY">y</div>
            <div class="keyboard__key" data-code="KeyU">u</div>
            <div class="keyboard__key" data-code="KeyI">i</div>
            <div class="keyboard__key" data-code="KeyO">o</div>
            <div class="keyboard__key" data-code="KeyP">p</div>
            <div class="keyboard__key" data-code="BracketLeft">[</div>
            <div class="keyboard__key" data-code="BracketRight">]</div>
            <div class="keyboard__key backslash" data-code="Backslash">\</div>
          </div>

          <div class="keyboard__keys">
            <div class="keyboard__key capslock letter-key" data-code="CapsLock">Caps</div>
            <div class="keyboard__key" data-code="KeyA">a</div>
            <div class="keyboard__key" data-code="KeyS">s</div>
            <div class="keyboard__key" data-code="KeyD">d</div>
            <div class="keyboard__key" data-code="KeyF">f</div>
            <div class="keyboard__key" data-code="KeyG">g</div>
            <div class="keyboard__key" data-code="KeyH">h</div>
            <div class="keyboard__key" data-code="KeyJ">j</div>
            <div class="keyboard__key" data-code="KeyK">k</div>
            <div class="keyboard__key" data-code="KeyL">l</div>
            <div class="keyboard__key" data-code="Semicolon">;</div>
            <div class="keyboard__key" data-code="Quote">'</div>
            <div class="keyboard__key enter letter-key" data-code="Enter">Enter</div>
          </div>

          <div class="keyboard__keys">
            <div class="keyboard__key lshift letter-key" data-code="ShiftLeft">Shift</div>
            <div class="keyboard__key" data-code="KeyZ">z</div>
            <div class="keyboard__key" data-code="KeyX">x</div>
            <div class="keyboard__key" data-code="KeyC">c</div>
            <div class="keyboard__key" data-code="KeyV">v</div>
            <div class="keyboard__key" data-code="KeyB">b</div>
            <div class="keyboard__key" data-code="KeyN">n</div>
            <div class="keyboard__key" data-code="KeyM">m</div>
            <div class="keyboard__key" data-code="Comma">,</div>
            <div class="keyboard__key" data-code="Period">.</div>
            <div class="keyboard__key" data-code="Slash">/</div>
            <div class="keyboard__key rshift letter-key" data-code="ShiftRight">Shift</div>
          </div>

          <div class="keyboard__keys">
            <div class="keyboard__key lctrl letter-key" data-code="ControlLeft">Ctrl</div>
            <div class="keyboard__key lalt letter-key" data-code="AltLeft">Alt</div>
            <div class="keyboard__key space" data-code="Space"></div>
            <div class="keyboard__key ralt letter-key" data-code="AltRight">Alt</div>
            <div class="keyboard__key rctrl letter-key" data-code="ControlRight">Ctrl</div>
          </div>
        </div>
      </div>

      <div id="modal-start" class="modal-overlay">
        <div
          class="modal modal--start"
          role="dialog"
          aria-modal="true"
          aria-labelledby="modal-start-title"
        >
          <div class="modal__content">
            <h2 id="modal-start-title" class="modal__title">Choose time</h2>

            <div class="modal__options">
              <button type="button" class="modal__option" data-duration="30">
                30 sec
              </button>

              <button type="button" class="modal__option" data-duration="60">
                60 sec
              </button>

              <button type="button" class="modal__option" data-duration="120">
                120 sec
              </button>
            </div>
          </div>
        </div>
      </div>

      <div id="modal-result" class="modal-overlay" hidden>
        <div
          class="modal modal--result"
          role="dialog"
          aria-modal="true"
          aria-labelledby="modal-result-title"
        >
          <div class="modal__content">
            <h2 id="modal-result-title" class="modal__title">Your result</h2>

            <p>WPM: <span class="modal__wpm">0</span></p>
            <p>Accuracy: <span class="modal__accuracy">0</span>%</p>
            <p>Errors: <span class="modal__errors">0</span></p>

            <div class="history" tabindex="0" aria-label="Typed text"></div>

            <button type="button" class="modal__reset">Try again</button>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
