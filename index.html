<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Keyboard</title>
    <link rel="stylesheet" href="./src/styles/style.css" />
    <script defer type="module" src="./src/app.js"></script>
  </head>

  <body>
    <main>
      <div class="container">
        <div class="display">
          <div class="stats">
            <span>WPM: 0</span>
            <span>Accuracy: <span class="accuracy">100</span>%</span>
            <span
              >Errors:
              <span class="stat__value errors">0</span>
            </span>
            <span class="timer">
              Time: 00:<span class="stat__value seconds">00</span>
            </span>
          </div>

          <div class="text"></div>
        </div>

        <div class="keyboard">
          <div class="keyboard__keys">
            <button type="button" class="keyboard__key" data-key="~">~</button>
            <button type="button" class="keyboard__key" data-key="1">1</button>
            <button type="button" class="keyboard__key" data-key="2">2</button>
            <button type="button" class="keyboard__key" data-key="3">3</button>
            <button type="button" class="keyboard__key" data-key="4">4</button>
            <button type="button" class="keyboard__key" data-key="5">5</button>
            <button type="button" class="keyboard__key" data-key="6">6</button>
            <button type="button" class="keyboard__key" data-key="7">7</button>
            <button type="button" class="keyboard__key" data-key="8">8</button>
            <button type="button" class="keyboard__key" data-key="9">9</button>
            <button type="button" class="keyboard__key" data-key="0">0</button>
            <button type="button" class="keyboard__key" data-key="-">-</button>
            <button type="button" class="keyboard__key" data-key="=">=</button>
            <button
              type="button"
              class="keyboard__key backspace letter-key"
              data-key="Backspace"
            >
              Backspace
            </button>
          </div>

          <div class="keyboard__keys">
            <button
              type="button"
              class="keyboard__key tab letter-key"
              data-key="Tab"
            >
              Tab
            </button>
            <button type="button" class="keyboard__key" data-key="q">q</button>
            <button type="button" class="keyboard__key" data-key="w">w</button>
            <button type="button" class="keyboard__key" data-key="e">e</button>
            <button type="button" class="keyboard__key" data-key="r">r</button>
            <button type="button" class="keyboard__key" data-key="t">t</button>
            <button type="button" class="keyboard__key" data-key="y">y</button>
            <button type="button" class="keyboard__key" data-key="u">u</button>
            <button type="button" class="keyboard__key" data-key="i">i</button>
            <button type="button" class="keyboard__key" data-key="o">o</button>
            <button type="button" class="keyboard__key" data-key="p">p</button>
            <button type="button" class="keyboard__key" data-key="[">[</button>
            <button type="button" class="keyboard__key" data-key="]">]</button>
            <button type="button" class="keyboard__key backslash" data-key="\">
              \
            </button>
          </div>

          <div class="keyboard__keys">
            <button
              type="button"
              class="keyboard__key capslock letter-key"
              data-key="Capslock"
            >
              Caps
            </button>
            <button type="button" class="keyboard__key" data-key="a">a</button>
            <button type="button" class="keyboard__key" data-key="s">s</button>
            <button type="button" class="keyboard__key" data-key="d">d</button>
            <button type="button" class="keyboard__key" data-key="f">f</button>
            <button type="button" class="keyboard__key" data-key="g">g</button>
            <button type="button" class="keyboard__key" data-key="h">h</button>
            <button type="button" class="keyboard__key" data-key="j">j</button>
            <button type="button" class="keyboard__key" data-key="k">k</button>
            <button type="button" class="keyboard__key" data-key="l">l</button>
            <button type="button" class="keyboard__key" data-key=";">;</button>
            <button type="button" class="keyboard__key" data-key="'">'</button>
            <button
              type="button"
              class="keyboard__key enter letter-key"
              data-key="Enter"
            >
              Enter
            </button>
          </div>

          <div class="keyboard__keys">
            <button
              type="button"
              class="keyboard__key lshift letter-key"
              data-key="Shift"
            >
              Shift
            </button>
            <button type="button" class="keyboard__key" data-key="z">z</button>
            <button type="button" class="keyboard__key" data-key="x">x</button>
            <button type="button" class="keyboard__key" data-key="c">c</button>
            <button type="button" class="keyboard__key" data-key="v">v</button>
            <button type="button" class="keyboard__key" data-key="b">b</button>
            <button type="button" class="keyboard__key" data-key="n">n</button>
            <button type="button" class="keyboard__key" data-key="m">m</button>
            <button type="button" class="keyboard__key" data-key=",">,</button>
            <button type="button" class="keyboard__key" data-key=".">.</button>
            <button type="button" class="keyboard__key" data-key="/">/</button>
            <button
              type="button"
              class="keyboard__key rshift letter-key"
              data-key="Shift"
            >
              Shift
            </button>
          </div>

          <div class="keyboard__keys">
            <button
              type="button"
              class="keyboard__key lctrl letter-key"
              data-key="Control"
            >
              Ctrl
            </button>
            <button
              type="button"
              class="keyboard__key lalt letter-key"
              data-key="Alt"
            >
              Alt
            </button>
            <button
              type="button"
              class="keyboard__key space"
              data-key=" "
            ></button>
            <button
              type="button"
              class="keyboard__key ralt letter-key"
              data-key="Alt"
            >
              Alt
            </button>
            <button
              type="button"
              class="keyboard__key rctrl letter-key"
              data-key="Control"
            >
              Ctrl
            </button>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
